<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Core Glow Filters -->
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001858" flood-opacity="0.25" />
    </filter>

    <!-- Radial Sphere Gradients -->
    <radialGradient id="goldSphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="15%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="92%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <radialGradient id="goldSphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Blue Ring Gradients -->
    <linearGradient id="blueRingMain" x1="120" y1="80" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0038A8" />
      <stop offset="75%" stop-color="#002277" />
      <stop offset="100%" stop-color="#001654" />
    </linearGradient>

    <linearGradient id="blueRingLight" x1="160" y1="100" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="blueOuterCrest" x1="80" y1="360" x2="380" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002277" />
      <stop offset="20%" stop-color="#0038A8" />
      <stop offset="55%" stop-color="#1D4ED8" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="blueInnerRim" x1="180" y1="180" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001446" />
      <stop offset="40%" stop-color="#00288E" />
      <stop offset="100%" stop-color="#001750" />
    </linearGradient>

    <!-- Golden Arrow & Ribbon Gradients -->
    <linearGradient id="goldRibbon" x1="100" y1="360" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <linearGradient id="arrowHeadLit" x1="370" y1="130" x2="450" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="arrowHeadShadow" x1="390" y1="150" x2="460" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Small Orb Gradients -->
    <radialGradient id="cyanOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <radialGradient id="smallGoldOrb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
  </defs>

  <!-- BACKGROUND SHADOW FOR 3D EFFECT -->
  <g filter="url(#subtle-shadow)">
    <!-- BACK/BOTTOM BLUE ORBITAL WING -->
    <path
      d="M 120 310 C 80 250 85 175 140 120 C 195 65 290 60 370 115 C 385 125 365 140 330 135 C 270 125 195 135 155 180 C 120 220 120 270 150 315 Z"
      fill="url(#blueRingMain)"
    />

    <!-- UPPER ARCH TOP-RIGHT CREST SWOOSH -->
    <path
      d="M 170 135 C 240 85 340 90 380 140 C 370 142 350 142 320 140 C 275 138 215 152 175 185 C 160 170 162 145 170 135 Z"
      fill="url(#blueRingLight)"
    />
    <path
      d="M 280 102 C 340 105 385 125 382 142 C 360 140 325 138 280 142 C 305 125 340 115 375 135 C 340 112 290 106 280 102 Z"
      fill="#60A5FA"
      opacity="0.8"
    />

    <!-- MAIN FOREGROUND BLUE ORBITAL RING (Sweeping from Top Left, through Bottom, around Central Sphere) -->
    <!-- Outer thick sweeping loop -->
    <path
      d="M 75 305 C 50 350 70 395 130 425 C 205 460 325 445 410 380 C 475 330 485 260 445 200 C 425 170 395 180 390 205 C 420 250 410 305 360 350 C 295 405 200 415 140 385 C 95 360 85 330 95 300 Z"
      fill="url(#blueRingMain)"
    />

    <!-- Top glossy highlight rim on the outer bottom ring -->
    <path
      d="M 100 325 C 85 355 105 385 145 405 C 210 435 315 425 385 370 C 430 335 445 285 435 240 C 428 255 418 275 395 305 C 340 365 245 390 170 375 C 130 365 110 345 100 325 Z"
      fill="url(#blueRingLight)"
    />

    <!-- Inner Blue Crescent framing the Central Sphere -->
    <path
      d="M 140 270 C 135 210 170 155 240 135 C 310 115 385 140 405 195 C 415 220 395 245 370 230 C 350 180 290 155 235 175 C 185 195 160 240 170 285 C 150 290 142 282 140 270 Z"
      fill="url(#blueInnerRim)"
    />

    <!-- Inner rim electric blue highlight line -->
    <path
      d="M 165 185 C 215 145 295 135 355 165 C 320 150 250 155 200 185 C 175 205 160 235 158 265 C 152 245 155 210 165 185 Z"
      fill="#60A5FA"
    />

    <!-- GOLDEN TRACK & ASCENDING ARROW -->
    <!-- The thin dynamic golden track running along the loop -->
    <path
      d="M 95 345 C 80 375 110 400 150 405 C 240 415 340 365 395 285 C 430 235 430 185 390 155 C 365 135 340 175 345 195 C 375 220 380 255 350 295 C 305 355 220 385 155 375 C 120 370 100 355 95 345 Z"
      fill="url(#goldRibbon)"
      opacity="0.95"
    />

    <!-- Golden Sweeping Ramp rising to Arrowhead -->
    <path
      d="M 315 210 C 345 175 370 130 405 95 L 420 125 C 390 155 365 200 335 235 Z"
      fill="url(#goldRibbon)"
    />

    <!-- 3D Bold Ascending Arrow Head (Pointing Northeast ~45 deg) -->
    <!-- Left/Upper Lit Face -->
    <path
      d="M 370 100 L 455 75 L 435 145 L 415 125 L 370 100 Z"
      fill="url(#arrowHeadLit)"
    />
    <!-- Right/Lower Shadow Face -->
    <path
      d="M 455 75 L 445 150 L 415 125 L 455 75 Z"
      fill="url(#arrowHeadShadow)"
    />
    <!-- Arrow Head Bevel Ridge Highlight -->
    <path
      d="M 455 75 L 415 125"
      stroke="#FFFBEB"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- CENTRAL GLOWING SUN/SPHERE -->
    <!-- Outer ambient radial aura -->
    <circle cx="256" cy="256" r="88" fill="url(#goldSphereGlow)" filter="url(#core-glow)" />

    <!-- Solid Core Sphere with 3D Depth & Lighting -->
    <circle cx="256" cy="256" r="74" fill="url(#goldSphere)" />

    <!-- Specular Highlight Sheen on Sphere -->
    <ellipse cx="230" cy="225" rx="36" ry="24" transform="rotate(-30 230 225)" fill="#FFFFFF" opacity="0.45" />
    <ellipse cx="222" cy="216" rx="14" ry="8" transform="rotate(-30 222 216)" fill="#FFFFFF" opacity="0.85" />

    <!-- ORBITAL PLANETARY BEADS -->
    <!-- 1. Upper-Left Cyan Orb on the Blue Track -->
    <g transform="translate(180, 160)">
      <circle cx="0" cy="0" r="22" fill="#0284C7" filter="url(#subtle-shadow)" />
      <circle cx="0" cy="0" r="18" fill="url(#cyanOrb)" />
      <ellipse cx="-4" cy="-5" rx="6" ry="3.5" transform="rotate(-25 -4 -5)" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 2. Lower-Left Golden Orb on the Outer Blue Ribbon -->
    <g transform="translate(92, 342)">
      <circle cx="0" cy="0" r="24" fill="#B45309" filter="url(#subtle-shadow)" />
      <circle cx="0" cy="0" r="20" fill="url(#smallGoldOrb)" />
      <ellipse cx="-5" cy="-5" rx="6" ry="3.5" transform="rotate(-30 -5 -5)" fill="#FFFFFF" opacity="0.85" />
    </g>
  </g>
</svg>
